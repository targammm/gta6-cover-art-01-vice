<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Maker v2 — six-panel GTA-style cover art</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>Vice Cover Maker</h1>
    <p class="tagline">Six photos, one sunset, your caption — a GTA-style cover in three post sizes.</p>
    <label>Caption <input id="caption" type="text" maxlength="40" value="VICE CITY"></label>
    <label>Sub-caption <input id="subcaption" type="text" maxlength="60" value="A SUNSET STORY"></label>
    <label>Badge <input id="badge" type="text" maxlength="40" value="EST. 2026 • LEONIDA"></label>
    <div class="group">
      <span class="group-label">Grade</span>
      <div class="btn-row">
        <button type="button" data-grade="sunset" class="active">Sunset</button>
        <button type="button" data-grade="neon">Neon</button>
        <button type="button" data-grade="midnight">Midnight</button>
      </div>
    </div>
    <div class="group">
      <span class="group-label">Export size</span>
      <div class="btn-row">
        <button type="button" data-size="square" class="active">1080 × 1080</button>
        <button type="button" data-size="portrait">1080 × 1350</button>
        <button type="button" data-size="landscape">1920 × 1080</button>
      </div>
    </div>
    <div class="group">
      <span class="group-label">Panels — click a photo, then crop it</span>
      <div id="panelStrip" class="strip"></div>
    </div>
    <div class="group sliders">
      <label>Zoom <input id="zoom" type="range" min="1" max="2.5" step="0.01" value="1"> <span id="zoomVal">1.00×</span></label>
      <label>Move X <input id="offsetX" type="range" min="-0.5" max="0.5" step="0.01" value="0"> <span id="offsetXVal">0%</span></label>
      <label>Move Y <input id="offsetY" type="range" min="-0.5" max="0.5" step="0.01" value="0"> <span id="offsetYVal">0%</span></label>
    </div>
    <label class="upload">Upload a photo for this panel <input id="photoFile" type="file" accept="image/*"></label>
    <label>Fill all panels <select id="fillAll"></select></label>
    <div class="btn-row">
      <button id="shuffle" type="button">Shuffle photos</button>
      <button id="export" type="button" class="primary">Export PNG</button>
    </div>
    <p id="status" role="status"></p>
    <p class="fine">Photos stay on your machine. Fonts: Anton + Archivo Black (SIL OFL). No Rockstar art, logo or font.</p>
  </section>
  <section class="preview" aria-label="Cover preview">
    <canvas id="cover" width="1080" height="1080"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
